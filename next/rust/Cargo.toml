[workspace]
members = ["crates/domain", "crates/server", "crates/storage", "crates/sync", "crates/sync-core", "crates/sync-jni"]
resolver = "2"
[workspace.package]
version = "3.0.0-preview.1"
edition = "2024"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[profile.release]
strip = true
lto = "thin"
