[package]
name="desk-sync"
version.workspace=true
edition.workspace=true
[dependencies]
serde.workspace=true
serde_json.workspace=true
uuid={version="1",features=["v4"]}
reqwest={version="0.12",default-features=false,features=["blocking","json","native-tls"]}
fs2="0.4"
windows-sys={version="0.61",features=["Win32_Foundation","Win32_Security_Cryptography","Win32_Storage_FileSystem"]}
aes-gcm="0.10"
sha2="0.10"
base64="0.22"
getrandom="0.3"

desk-sync-core = { path = "../sync-core" }
