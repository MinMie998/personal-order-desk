[package]
name = "desk-desktop"
version = "3.0.0-preview.1"
edition = "2024"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog="2"
desk-sync={path="../rust/crates/sync"}
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
fs2 = "0.4"
base64 = "0.22"
semver = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
[profile.release]
strip = true
lto = "thin"
